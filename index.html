<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the game draw under notches; we add safe-area padding ourselves -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfe9f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lanternfold Run</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2718%27 r=%2712%27 fill=%27%238ebd6b%27/%3E%3Ccircle cx=%2724%27 cy=%278%27 r=%275%27 fill=%27%23ffd980%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- in-run controls (the rest of the HUD is drawn on the canvas) -->
    <button id="btn-pause" class="icon-btn hidden" data-i18n-aria="hud.pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="2"/><rect x="13.8" y="5" width="4.2" height="14" rx="2"/></svg>
    </button>
    <button id="btn-skip" class="chip hidden" data-i18n="tips.skip"></button>

    <!-- TITLE -->
    <section id="screen-title" class="screen">
      <div class="title-top">
        <h1 class="logo"><span data-i18n="title.name1"></span><span class="logo2" data-i18n="title.name2"></span></h1>
        <p class="tagline" data-i18n="title.tagline"></p>
      </div>
      <div class="title-bottom">
        <p class="pill" id="title-best"></p>
        <button id="btn-play" class="btn big" data-i18n="title.play"></button>
        <button id="btn-daily" class="btn small ghost"><span id="daily-label">Daily Run</span><span class="badge hidden" id="daily-badge"></span></button>
        <nav class="tiles" aria-label="Menu">
          <button class="tile" data-open="companions"><span class="tile-ic">&#129418;</span><span>Friends</span><i class="dot hidden" id="dot-companions"></i></button>
          <button class="tile" data-open="upgrades"><span class="tile-ic">&#127793;</span><span>Upgrades</span><i class="dot hidden" id="dot-upgrades"></i></button>
          <button class="tile" data-open="quests"><span class="tile-ic">&#128220;</span><span>Quests</span><i class="dot hidden" id="dot-quests"></i></button>
          <button class="tile" data-open="settings"><span class="tile-ic">&#9881;&#65039;</span><span>Settings</span></button>
        </nav>
        <p class="pill soft" id="title-seeds"></p>
      </div>
      <button id="ver" class="ver" aria-hidden="true">v0.1.0</button>
    </section>

    <!-- PAUSE -->
    <section id="screen-pause" class="screen dim hidden">
      <div class="card center">
        <h2 data-i18n="pause.title"></h2>
        <button id="btn-resume" class="btn big" data-i18n="pause.resume"></button>
        <div class="row">
          <button id="btn-restart" class="btn small" data-i18n="pause.restart"></button>
          <button id="btn-pause-home" class="btn small ghost" data-i18n="pause.home"></button>
        </div>
      </div>
    </section>

    <!-- GAME OVER -->
    <section id="screen-over" class="screen over hidden">
      <div class="card">
        <h2 id="over-title"></h2>
        <div class="ribbon hidden" id="over-newbest" data-i18n="over.newbest"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="over.distance"></span><span class="v" id="o-dist">0</span></div>
          <div class="stat"><span class="k" data-i18n="over.score"></span><span class="v" id="o-score">0</span></div>
          <div class="stat"><span class="k" data-i18n="over.seeds"></span><span class="v" id="o-seeds">0</span></div>
        </div>
        <p class="compare" id="o-compare"></p>
        <div class="goal">
          <div class="bar"><i id="o-fill"></i></div>
          <p id="o-goal"></p>
        </div>
        <div id="o-extra"></div>
        <p class="warn hidden" id="o-warn"></p>
      </div>
      <div class="actions">
        <button id="btn-chest" class="btn small hidden"></button>
        <button id="btn-again" class="btn big" data-i18n="over.again"></button>
        <button id="btn-home" class="btn small ghost" data-i18n="over.home"></button>
      </div>
    </section>

    <!-- MENU SHEETS (companions, upgrades, quests, settings, acorn) -->
    <section id="screen-menu" class="screen sheet hidden">
      <header class="sheet-head">
        <button id="menu-back" class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#5c4033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h2 id="menu-title"></h2>
        <span class="head-space"></span>
      </header>
      <div id="menu-body" class="scroll"></div>
    </section>

    <!-- gentle take-a-break note -->
    <aside id="break-note" class="break hidden" role="status">
      <p>You've been playing a while. Bramble says: stretch, sip some water, rest your eyes.</p>
      <button id="break-ok" class="btn small">Thanks, Bramble</button>
    </aside>

    <div id="rotate" class="hidden"><div><div class="rot-icon">&#128241;</div><p data-i18n="rotate.msg"></p></div></div>
    <div id="safe-probe" aria-hidden="true"></div>
    <pre id="debug" class="hidden"></pre>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
