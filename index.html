<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the game draw under notches; we add safe-area padding ourselves -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfe9f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lanternfold Run</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- in-run controls (the rest of the HUD is drawn on the canvas) -->
    <button id="btn-pause" class="icon-btn hidden" data-i18n-aria="hud.pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="2"/><rect x="13.8" y="5" width="4.2" height="14" rx="2"/></svg>
    </button>
    <button id="btn-skip" class="chip hidden" data-i18n="tips.skip"></button>

    <!-- TITLE -->
    <section id="screen-title" class="screen">
      <div class="title-top">
        <h1 class="logo"><span data-i18n="title.name1"></span><span class="logo2" data-i18n="title.name2"></span></h1>
        <p class="tagline" data-i18n="title.tagline"></p>
      </div>
      <div class="title-bottom">
        <p class="pill" id="title-best"></p>
        <button id="btn-play" class="btn big" data-i18n="title.play"></button>
      </div>
      <button id="ver" class="ver" aria-hidden="true">v0.1.0</button>
    </section>

    <!-- PAUSE -->
    <section id="screen-pause" class="screen dim hidden">
      <div class="card center">
        <h2 data-i18n="pause.title"></h2>
        <button id="btn-resume" class="btn big" data-i18n="pause.resume"></button>
        <div class="row">
          <button id="btn-restart" class="btn small" data-i18n="pause.restart"></button>
          <button id="btn-pause-home" class="btn small ghost" data-i18n="pause.home"></button>
        </div>
      </div>
    </section>

    <!-- GAME OVER -->
    <section id="screen-over" class="screen over hidden">
      <div class="card">
        <h2 id="over-title"></h2>
        <div class="ribbon hidden" id="over-newbest" data-i18n="over.newbest"></div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="over.distance"></span><span class="v" id="o-dist">0</span></div>
          <div class="stat"><span class="k" data-i18n="over.score"></span><span class="v" id="o-score">0</span></div>
          <div class="stat"><span class="k" data-i18n="over.seeds"></span><span class="v" id="o-seeds">0</span></div>
        </div>
        <p class="compare" id="o-compare"></p>
        <div class="goal">
          <div class="bar"><i id="o-fill"></i></div>
          <p id="o-goal"></p>
        </div>
        <p class="warn hidden" id="o-warn"></p>
      </div>
      <div class="actions">
        <button id="btn-again" class="btn big" data-i18n="over.again"></button>
        <button id="btn-home" class="btn small ghost" data-i18n="over.home"></button>
      </div>
    </section>

    <div id="rotate" class="hidden"><div><div class="rot-icon">&#128241;</div><p data-i18n="rotate.msg"></p></div></div>
    <div id="safe-probe" aria-hidden="true"></div>
    <pre id="debug" class="hidden"></pre>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
